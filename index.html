<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2c5f5a" />
  <title>Phrase Practice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗣️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Back to menu">←</button>
    <h1 id="topTitle">Phrase Practice</h1>
    <span class="topbar-spacer"></span>
  </header>

  <main id="app"></main>

  <template id="tpl-home">
    <section class="screen home">
      <button class="numbers-cta" id="goNumbersBtn">🔢 Numbers Trainer (0–9,999) →</button>

      <div class="lang-tabs" id="langTabs"></div>

      <div class="card-panel" id="voicePanel">
        <h2>Voice</h2>
        <select class="voice-select" id="voiceSelect"></select>
        <button class="link-btn voice-test-btn" id="voiceTestBtn">🔊 Test this voice</button>
        <p class="voice-hint">Sounds robotic or off? Your device may only have a low-quality voice installed for this language. On iPhone: Settings → Accessibility → Read &amp; Speak → Voices → pick the language → download an Enhanced or Premium voice. Note: iOS Safari doesn't always expose those downloaded voices to web pages like this one — if your new voice still isn't listed below after downloading it, that's an iOS/Safari limitation, not something this app can work around. On Android: Settings → Accessibility → Text-to-speech.</p>
        <button class="link-btn debug-voices-btn" id="debugVoicesBtn">Show every voice this browser reports →</button>
        <pre class="debug-voices-list" id="debugVoicesList" hidden></pre>
      </div>

      <div class="card-panel">
        <h2>Direction</h2>
        <div class="pill-row" id="directionRow">
          <button class="pill" data-dir="native-en">See term → recall English</button>
          <button class="pill" data-dir="en-native">See English → recall term</button>
        </div>
      </div>

      <div class="card-panel">
        <h2>Sections</h2>
        <div class="pill-row" id="sectionRow"></div>
        <div class="section-actions">
          <button class="link-btn" id="allSections">All</button>
          <button class="link-btn" id="noSections">None</button>
        </div>
      </div>

      <div class="card-panel" id="weakOnlyPanel">
        <label class="switch-row">
          <input type="checkbox" id="weakOnly" />
          <span>Only cards I've missed before</span>
        </label>
      </div>

      <button class="primary-btn" id="startBtn">Start practicing</button>

      <p class="deck-count" id="deckCount"></p>
    </section>
  </template>

  <template id="tpl-session">
    <section class="screen session">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <span id="progressLabel" class="progress-label"></span>
      </div>

      <div class="flashcard" id="flashcard">
        <div class="flashcard-inner" id="flashcardInner">
          <div class="face face-front">
            <span class="face-tag" id="frontTag"></span>
            <p class="face-text" id="frontText"></p>
            <p class="face-sub" id="frontSub"></p>
          </div>
          <div class="face face-back">
            <span class="face-tag" id="backTag"></span>
            <p class="face-text" id="backText"></p>
            <p class="face-sub" id="backSub"></p>
          </div>
        </div>
      </div>
      <p class="tap-hint" id="tapHint">Tap the card to flip</p>

      <div class="audio-row">
        <button class="round-btn" id="speakBtn" aria-label="Hear pronunciation">🔊</button>
        <button class="round-btn" id="recordBtn" aria-label="Record yourself">🎤</button>
        <button class="round-btn" id="playbackBtn" aria-label="Play your recording" hidden>▶️</button>
      </div>
      <p class="record-status" id="recordStatus"></p>
      <div class="match-badge" id="matchBadge" hidden></div>

      <div class="rating-row" id="ratingRow" hidden>
        <button class="rate-btn miss" id="missBtn">Didn't know it</button>
        <button class="rate-btn know" id="knowBtn">Knew it</button>
      </div>
    </section>
  </template>

  <template id="tpl-summary">
    <section class="screen summary">
      <h2>Session complete 🎉</h2>
      <div class="summary-stats" id="summaryStats"></div>
      <button class="primary-btn" id="practiceWeakBtn">Practice the shaky ones again</button>
      <button class="secondary-btn" id="menuBtn">Back to menu</button>
    </section>
  </template>

  <template id="tpl-numbers-home">
    <section class="screen home">
      <div class="lang-tabs" id="numLangTabs"></div>

      <div class="card-panel" id="numVoicePanel">
        <h2>Voice</h2>
        <select class="voice-select" id="numVoiceSelect"></select>
        <button class="link-btn voice-test-btn" id="numVoiceTestBtn">🔊 Test this voice</button>
        <p class="voice-hint">Sounds robotic or off? Your device may only have a low-quality voice installed for this language. On iPhone: Settings → Accessibility → Read &amp; Speak → Voices → pick the language → download an Enhanced or Premium voice. Note: iOS Safari doesn't always expose those downloaded voices to web pages like this one — if your new voice still isn't listed below after downloading it, that's an iOS/Safari limitation, not something this app can work around. On Android: Settings → Accessibility → Text-to-speech.</p>
      </div>

      <div class="card-panel">
        <h2>Range</h2>
        <div class="pill-row" id="numRangeRow">
          <button class="pill" data-range="0-99">0–99</button>
          <button class="pill" data-range="0-999">0–999</button>
          <button class="pill" data-range="0-9999">0–9,999</button>
        </div>
      </div>

      <div class="card-panel">
        <h2>Mode</h2>
        <div class="pill-row" id="numModeRow">
          <button class="pill" data-mode="learn">📖 Learn (see + hear)</button>
          <button class="pill" data-mode="quiz">⌨️ Quiz (hear, type it)</button>
        </div>
        <p class="mode-hint" id="modeHint"></p>
      </div>

      <button class="primary-btn" id="numStartBtn">Start</button>
    </section>
  </template>

  <template id="tpl-numbers-learn">
    <section class="screen numbers-learn">
      <p class="num-seen" id="numSeenCount"></p>

      <div class="number-display">
        <p class="number-digits" id="numDigits"></p>
        <p class="number-words" id="numWords"></p>
      </div>

      <div class="audio-row">
        <button class="round-btn" id="numSpeakBtn" aria-label="Hear this number">🔊</button>
      </div>

      <button class="primary-btn" id="numNextBtn">Next number →</button>

      <button class="link-btn switch-mode-btn" id="numToQuizBtn">Ready to test yourself? Switch to Quiz mode →</button>
    </section>
  </template>

  <template id="tpl-numbers-quiz">
    <section class="screen numbers-quiz">
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" id="numProgressFill"></div></div>
        <span id="numProgressLabel" class="progress-label"></span>
      </div>
      <p class="quiz-score" id="quizScore"></p>

      <div class="number-display quiz">
        <p class="number-prompt">Listen and type the number</p>
      </div>

      <div class="audio-row">
        <button class="round-btn" id="numQuizSpeakBtn" aria-label="Replay number">🔊</button>
      </div>

      <form id="numAnswerForm" class="answer-form" novalidate>
        <input type="text" inputmode="numeric" id="numAnswerInput" class="answer-input" placeholder="Type what you heard" autocomplete="off" />
        <button type="submit" class="primary-btn" id="numSubmitBtn">Check</button>
      </form>

      <div class="quiz-feedback" id="quizFeedback" hidden></div>

      <button class="primary-btn" id="numNextQuizBtn" hidden>Next →</button>

      <button class="link-btn switch-mode-btn" id="numToLearnBtn">← Back to Learn mode</button>
    </section>
  </template>

  <template id="tpl-numbers-summary">
    <section class="screen summary">
      <h2>Numbers round complete 🔢</h2>
      <div class="summary-stats" id="numSummaryStats"></div>
      <button class="primary-btn" id="numPracticeAgainBtn">Practice again</button>
      <button class="secondary-btn" id="numMenuBtn">Back to menu</button>
    </section>
  </template>

  <script src="data.js"></script>
  <script src="numbers.js"></script>
  <script src="app.js"></script>
</body>
</html>
